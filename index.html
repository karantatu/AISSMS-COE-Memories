<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Website Under Development</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;

      /* LOCAL IMAGE */
      background:
      linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
      url('image1.jpg');

      background-size:cover;
      background-position:center;
    }

    .container{
      text-align:center;
      color:white;
      padding:25px;
      width:90%;
      max-width:400px;
    }

    .container h1{
      font-size:38px;
      margin-bottom:15px;
      line-height:1.2;
    }

    .container p{
      font-size:15px;
      color:#f1f1f1;
      margin-bottom:25px;
      line-height:1.6;
    }

    .loader{
      width:70px;
      height:70px;
      border:5px solid rgba(255,255,255,0.3);
      border-top:5px solid white;
      border-radius:50%;
      margin:0 auto 25px;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    .status{
      display:inline-block;
      padding:10px 22px;
      background:rgba(255,255,255,0.15);
      border:1px solid rgba(255,255,255,0.2);
      backdrop-filter:blur(8px);
      border-radius:30px;
      font-size:14px;
    }

    .footer{
      position:absolute;
      bottom:20px;
      color:#ddd;
      font-size:13px;
      text-align:center;
      width:100%;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="loader"></div>

    <h1>
      Our Beautiful <br>
      College Memories
    </h1>

    <p>
      We are creating something emotional and unforgettable for our friend circle.
      The memory journey will be live soon.
    </p>

    <div class="status">
      🚧 Website Working In Progress
    </div>

  </div>

  <div class="footer">
    Different roads, same memories ❤️
  </div>

</body>

</html>
